<!doctype html>
<html lang="az">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1120" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme before first paint (no light/dark flash).
      try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    </script>
    <meta name="description" content="Kliniken Allianz Almaniya və digər ölkələrin aparıcı klinika və sanatoriyalarında müalicəni təşkil edir: həkim seçimi, viza, səyahət və yerləşmə." />
    <link rel="icon" type="image/png" href="/src/assets/favicon.png" />
    <link rel="preconnect" href="https://api.kliniken-allianz.com" crossorigin />
    <title>Kliniken Allianz</title>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
